org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.mpp.androidGradlePluginCompatibility.nowarnUnusedSourceSets=true

kotlin.mpp.enableCInteropCommonization=true

# Magpie (Nostr + Blossom publishing, beside Maven Central). Releases go to the release key's own
# relays, the write relays of its NIP-65 list (kind 10002) and the ones
# vitorpamplona.com/.well-known/nostr.json lists for it, which is where every client looks for them.
# Index relays are only where that relay list is looked up. For more copies, add write relays to the
# key's kind 10002.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
